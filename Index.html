<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Romaneio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<title>Romaneio Digital – Mucuripe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--surface2:#F7F9FA;--line:#DCE2E8;--ink:#0B3D61;--ink2:#3E4A55;--muted:#5B6773;
  --header:#0B3D61;--primary:#0B3D61;--onprimary:#FFFFFF;--accent:#B6C54C;--accentSoft:#F1F4D6;--accentText:#4A5200;
  --blue:#1C75BB;--blueSoft:#E8F2FA;--blueText:#145A90;--warn:#E8A33D;--warnSoft:#FFF6E6;--warnText:#8A5300;
  --pin:#C2410C;--selBg:#F1F4D6;--selLine:#0B3D61;--chip:#E6EAEE;--bar:#1C75BB;--barSoft:#A9CBE8;--fs:1;
  color-scheme: light;
}
:root[data-theme="escuro"]{
  --bg:#09141D;--surface:#112230;--surface2:#0D1B27;--line:#243848;--ink:#E9EFF4;--ink2:#C2CEDA;--muted:#93A4B3;
  --header:#0B2A42;--primary:#B6C54C;--onprimary:#0B2238;--accentSoft:#232D0E;--accentText:#D2DD7C;
  --blue:#5AA9E6;--blueSoft:#0F2E47;--blueText:#A6D0F2;--warnSoft:#33240C;--warnText:#F4C57E;--pin:#F27C4B;
  --selBg:#1E2A10;--selLine:#B6C54C;--chip:#1B2D3B;--bar:#5AA9E6;--barSoft:#2C5374;color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="sistema"]{
    --bg:#09141D;--surface:#112230;--surface2:#0D1B27;--line:#243848;--ink:#E9EFF4;--ink2:#C2CEDA;--muted:#93A4B3;
    --header:#0B2A42;--primary:#B6C54C;--onprimary:#0B2238;--accentSoft:#232D0E;--accentText:#D2DD7C;
    --blue:#5AA9E6;--blueSoft:#0F2E47;--blueText:#A6D0F2;--warnSoft:#33240C;--warnText:#F4C57E;--pin:#F27C4B;
    --selBg:#1E2A10;--selLine:#B6C54C;--chip:#1B2D3B;--bar:#5AA9E6;--barSoft:#2C5374;color-scheme: dark;
  }
}
:root[data-letra="grande"]{--fs:1.15}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-size:calc(15px*var(--fs));-webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--ink);background:var(--surface)}
input::placeholder{color:var(--muted)}
.hidden{display:none!important}

/* ---------- App do motorista ---------- */
.m-app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.m-head{position:sticky;top:0;z-index:5;height:60px;flex-shrink:0;background:var(--header);border-bottom:3px solid var(--accent);color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;padding-top:env(safe-area-inset-top)}
.m-head h1{flex:1;margin:0 0 0 8px;font-family:'Exo 2',sans-serif;font-style:italic;font-size:19px;font-weight:800;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-btn{width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.ic-btn.plain{border:0;background:transparent}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#0B2238;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.m-body{flex:1;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.m-foot{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.tabs{position:sticky;bottom:0;z-index:5;height:62px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-top:3px solid transparent}
.tabs button.on{color:var(--ink);font-weight:800;border-top-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.dark-card{background:#0B3D61;color:#fff;border-radius:14px;padding:14px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.q{font-size:calc(20px*var(--fs));font-weight:800;line-height:1.25;margin:0}
.btn{height:56px;border-radius:14px;border:0;background:var(--primary);color:var(--onprimary);font-size:17px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.btn.lime{background:#B6C54C;color:#0B2238}
.btn.out{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{height:44px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wiz-foot{display:flex;gap:10px}
.wiz-foot .back{width:56px;flex-shrink:0;height:56px;border-radius:14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center}
.prog{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.prog .t{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.5px}
.prog .segs{display:grid;gap:4px}
.prog .segs span{height:6px;border-radius:3px;background:var(--line)}
.prog .segs span.d{background:var(--ink)}
.prog .segs span.c{background:#8FA02A}
.field{height:56px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font-size:19px;font-weight:700;width:100%}
.field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blueSoft)}
.field.big{height:64px;font-size:22px;font-weight:800;letter-spacing:.5px}
.opt{border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.opt.on{border:3px solid var(--selLine);background:var(--selBg)}
.opt.col{flex-direction:column;justify-content:center;text-align:center;gap:12px}
.ico-sq{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.3px}
.chip.blue{background:var(--blueSoft);color:var(--blueText)}
.chip.lime{background:var(--accentSoft);color:var(--accentText)}
.chip.gray{background:var(--chip);color:var(--ink2)}
.chip.warn{background:#E8A33D;color:#3D2600}
.plate{border:1.5px solid var(--ink);border-radius:6px;padding:0 7px;font-weight:800;letter-spacing:1.2px;white-space:nowrap}
.info{display:flex;gap:8px;background:var(--blueSoft);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;color:var(--ink)}
.warnbox{display:flex;gap:8px;background:var(--warnSoft);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;color:var(--warnText)}
.item{display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.item.aj{background:var(--warnSoft);border:2px solid var(--warn)}
.item .t1{font-size:14px;font-weight:800;letter-spacing:.3px}
.item .t2{font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t3{font-size:11px;font-weight:600;color:var(--muted)}
.item .v{font-size:15px;font-weight:800;flex-shrink:0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:24px;font-weight:800}
.keypad button.f{background:var(--chip);font-size:13px}
.timebox{display:flex;align-items:center;gap:10px}
.timebox input{flex:1;min-width:0;height:64px;border-radius:12px;border:1.5px solid var(--ink);text-align:center;font-size:34px;font-weight:800}
.sug{min-height:60px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}
.bars{position:relative;height:150px;display:grid;gap:6px;align-items:end;border-bottom:1px solid var(--line)}
.bars .b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.bars .b span{font-size:10px;font-weight:700;color:var(--ink2)}
.bars .b div{width:100%;max-width:30px;border-radius:4px 4px 0 0;background:var(--bar)}
.hbar{display:grid;grid-template-columns:62px 1fr 76px;align-items:center;gap:8px;font-size:12px}
.hbar .tr{height:14px;border-radius:4px;background:var(--chip);overflow:hidden}
.hbar .tr div{height:100%;border-radius:4px;background:var(--bar)}
.switch{width:48px;height:28px;border-radius:14px;border:0;background:var(--chip);padding:3px;display:flex;justify-content:flex-start}
.switch span{width:22px;height:22px;border-radius:11px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on{background:var(--primary);justify-content:flex-end}
.switch.on span{background:var(--onprimary)}
.seg{display:grid;gap:4px;padding:3px;border-radius:10px;background:var(--chip)}
.seg button{height:40px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.login-hero{background:var(--header);color:#fff;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;position:relative}
.login-sheet{flex:1;background:var(--surface);border-radius:24px 24px 0 0;margin-top:-20px;padding:26px 20px 24px;display:flex;flex-direction:column;gap:16px}

/* ---------- Gestão ---------- */
.g-app{min-height:100vh;display:flex;flex-wrap:wrap;background:#F3F5F7;color:#0B3D61}
.g-side{flex:1 1 220px;max-width:100%;background:#0B3D61;color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.g-side nav{display:flex;flex-direction:column;gap:2px}
.g-side nav button{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:10px;color:#D5E0EA;font-size:14px;font-weight:600;border:0;border-left:3px solid transparent;background:transparent;text-align:left}
.g-side nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700;border-left-color:#B6C54C}
.g-main{flex:999 1 640px;min-width:0;padding:24px 28px 40px}
.g-wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.g-h1{margin:0;font-family:'Exo 2',sans-serif;font-style:italic;font-weight:800;font-size:26px;letter-spacing:.5px}
.g-sub{font-size:13px;color:#5B6773}
.g-card{background:#fff;border:1px solid #DCE2E8;border-radius:12px;padding:14px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.g-f{display:flex;flex-direction:column;gap:6px}
.g-f label,.g-f .l{font-size:11px;font-weight:700;color:#5B6773}
.g-in{height:40px;border:1px solid #C9D2DA;border-radius:10px;padding:0 10px;font-size:13px;color:#0B3D61;background:#fff;width:100%}
.g-btn{height:40px;padding:0 14px;border-radius:10px;border:0;background:#0B3D61;color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.g-btn.out{background:#fff;color:#0B3D61;border:1.5px solid #0B3D61}
.g-btn.lime{background:#B6C54C;color:#0B2238}
.g-btn.sm{height:30px;padding:0 9px;font-size:11px;border-radius:8px}
.g-btn:disabled{opacity:.45;cursor:default}
.g-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.g-kpi{background:#fff;border:1px solid #DCE2E8;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.g-kpi span{font-size:11px;font-weight:700;color:#5B6773}
.g-kpi b{font-size:22px}
.g-kpi.navy{background:#0B3D61;color:#fff;border-color:#0B3D61}.g-kpi.navy span{color:#C9D6E2}.g-kpi.navy b{color:#B6C54C}
.g-kpi.warn{background:#FFF6E6;border-color:#E8A33D;color:#8A5300}.g-kpi.warn span{color:#8A5300}
.g-tablebox{background:#fff;border:1px solid #DCE2E8;border-radius:12px;overflow:hidden}
.g-tablebox .hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid #DCE2E8}
.g-scroll{overflow-x:auto}
table.g{width:100%;border-collapse:collapse;font-size:12.5px}
table.g th{background:#F3F5F7;color:#3E4A55;font-size:11px;font-weight:800;padding:9px 8px;text-align:left;white-space:nowrap}
table.g td{padding:8px;border-top:1px solid #EDF0F2;vertical-align:middle}
table.g td.n,table.g th.n{text-align:right}
table.g tr.day td{background:#E9EEF2;font-weight:800}
table.g tr.aj td{background:#FFF1DA}
table.g tr.dif td{background:#FFF6E6}
table.g tr.falta td{background:#EEF5FC}
table.g tr.sobra td{background:#FDF0EA}
.g-chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;white-space:nowrap}
.st-OK{background:#F1F4D6;color:#4A5200}.st-VALOR_DIFERENTE{background:#E8A33D;color:#3D2600}.st-FALTA_SISTEMA{background:#1C75BB;color:#fff}.st-A_MAIS_SISTEMA{background:#C2410C;color:#fff}
.g-tabs{display:flex;gap:4px;border-bottom:1px solid #DCE2E8}
.g-tabs button{height:40px;padding:0 14px;border:0;background:transparent;color:#5B6773;font-weight:600;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.g-tabs button.on{color:#0B3D61;font-weight:800;border-bottom-color:#B6C54C}
.g-seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:3px;border-radius:10px;background:#EEF1F4}
.g-seg button{height:32px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:#3E4A55;font-weight:700;font-size:12px}
.g-seg button.on{background:#0B3D61;color:#fff;font-weight:800}
.g-radio{flex:1;min-height:130px;border-radius:12px;border:1px solid #DCE2E8;background:#fff;display:flex;flex-direction:column;gap:8px;padding:14px;text-align:left;color:#0B3D61}
.g-radio.on{border:2px solid #0B3D61;background:#F1F4D6}

/* ---------- Comuns ---------- */
#visor{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;color:#fff}
#visor video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
#visor .vt{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;background:#0B3D61;border-bottom:3px solid #B6C54C}
#visor .vb{padding:18px 16px calc(22px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;background:#000}
#visor .disparo{width:78px;height:78px;border-radius:39px;border:5px solid #fff;background:#B6C54C}
#visor .guia{position:absolute;left:8%;right:8%;top:30%;height:26%;border:3px dashed rgba(182,197,76,.9);border-radius:12px;pointer-events:none}
.km-in{letter-spacing:2px;text-align:center}
#loading{position:fixed;inset:0;z-index:50;background:rgba(9,20,29,.35);display:flex;align-items:center;justify-content:center}
#loading div{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.4);border-top-color:#B6C54C;animation:gira 0.8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:#0B2238;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:700;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.erro{background:#8A1C0C}
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(9,20,29,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.modal.gm{background:#fff;color:#0B3D61;border-radius:16px;margin:auto;align-self:center}
.full{position:fixed;inset:0;z-index:45;background:#525659;display:flex;flex-direction:column}
.full .bar{height:56px;background:#0B3D61;color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.full .bar b{flex:1;font-size:14px}
.full iframe{flex:1;width:100%;max-width:900px;margin:12px auto;border:0;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.4)}

/* =========================================================
 * ACABAMENTO PROFISSIONAL + PROPORÇÕES NO DESKTOP
 * ======================================================= */
html{-webkit-text-size-adjust:100%}
body{font-feature-settings:"tnum" 1}
.btn,.opt,.item,.ic-btn,.tabs button,.g-btn,.g-side nav button,.g-radio,.seg button,.g-seg button,.keypad button{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .05s}
.btn:active,.opt:active,.g-btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible,.item:focus-visible,.ic-btn:focus-visible,.tabs button:focus-visible,.g-btn:focus-visible,.g-side nav button:focus-visible,.g-radio:focus-visible{outline:3px solid #1C75BB;outline-offset:2px}
.card,.item,.opt{box-shadow:0 1px 2px rgba(11,61,97,.05)}
.hd-logo{display:none}
.tabs button{text-transform:uppercase}

/* ---------- Motorista: computador / tablet deitado ---------- */
@media (min-width: 960px){
  body{background:#E6EBF0}
  :root[data-theme="escuro"] body{background:#050B10}
  .m-app{max-width:1180px;min-height:calc(100vh - 48px);margin:24px auto;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 50px rgba(11,61,97,.14)}
  .m-head{position:relative;height:68px;padding:0 20px 0 12px;gap:10px}
  .m-head h1{font-size:20px;margin-left:4px}
  .hd-logo{display:block;height:30px;width:auto;margin:0 6px 0 4px;padding-right:16px;border-right:1px solid rgba(255,255,255,.25)}
  .m-body{padding:28px 32px;gap:14px}
  .m-foot{position:static;padding:16px 32px 20px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .m-foot > .btn{flex:0 1 auto;width:auto;min-width:300px;padding:0 28px}
  .m-foot > .row2{display:flex;gap:10px}
  .m-foot > .row2 .btn{width:auto;padding:0 20px;height:56px}
  .m-foot > span{flex-basis:100%;text-align:left!important}
  .m-foot .wiz-foot{width:100%}
  .m-foot .wiz-foot .btn{max-width:420px}

  /* com menu: navegação vira barra lateral */
  .m-app:has(> .tabs){display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"head head" "nav body" "nav foot"}
  .m-app:has(> .tabs) > .m-head{grid-area:head}
  .m-app:has(> .tabs) > .m-body{grid-area:body}
  .m-app:has(> .tabs) > .m-foot{grid-area:foot;border-top:1px solid var(--line)}
  .m-app:has(> .tabs) > .tabs{grid-area:nav;position:static;height:auto;display:flex;flex-direction:column;gap:4px;padding:20px 14px;border-top:0;border-right:1px solid var(--line);background:var(--surface2)}
  .tabs button{flex-direction:row;justify-content:flex-start;gap:12px;height:48px;padding:0 14px;border-radius:10px;border-top:0;border-left:3px solid transparent;font-size:14px;text-transform:none;letter-spacing:0}
  .tabs button:hover{background:var(--chip);color:var(--ink)}
  .tabs button.on{background:var(--selBg);border-left-color:var(--accent);color:var(--ink)}

  /* sem menu (passo a passo, abrir, encerrar…): coluna central confortável */
  .m-app:not(:has(> .tabs)) > .m-body,.m-app:not(:has(> .tabs)) > .prog{padding-left:max(32px,calc(50% - 340px));padding-right:max(32px,calc(50% - 340px))}
  .m-app:not(:has(> .tabs)) > .m-foot{padding-left:max(32px,calc(50% - 340px));padding-right:max(32px,calc(50% - 340px))}
  .m-app:not(:has(> .tabs)) > .m-foot > .btn{flex:1 1 100%;min-width:0}

  .kpis-m{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .bars{height:200px}
  .keypad{max-width:420px;margin:0 auto;width:100%}
  .q{font-size:24px}

  /* login: marca à esquerda, formulário à direita */
  .m-app:has(> .login-hero){display:grid;grid-template-columns:1fr 1fr;min-height:620px;max-width:1040px;margin:max(24px,calc(50vh - 330px)) auto}
  .m-app:has(> .login-hero) > .login-hero{min-height:100%;padding:48px}
  .m-app:has(> .login-hero) > .login-hero img{width:300px!important}
  .m-app:has(> .login-hero) > .login-sheet{margin:0;border-radius:0;padding:64px 72px;justify-content:center}
  .m-app:has(> .login-hero) > .login-sheet > div[style*="flex:1"]{display:none}

  .modal-bg{align-items:center;padding:24px}
  .modal{border-radius:20px;max-width:560px}
  #toast{bottom:40px}
}

/* ---------- Gestão ---------- */
.g-app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:#F2F5F8;font-size:14px}
.g-side{position:sticky;top:0;height:100vh;box-sizing:border-box;overflow-y:auto;max-width:none;padding:24px 16px 18px;gap:28px;background:linear-gradient(180deg,#0B3D61 0%,#0A3455 100%)}
.g-side nav{gap:3px}
.g-side nav button{height:44px;gap:12px;font-size:14px;padding:0 12px}
.g-side nav button svg{flex-shrink:0;opacity:.85}
.g-side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.g-side nav button.on svg{opacity:1;color:#B6C54C}
.g-side .g-sec{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#8FA8BD;padding:0 12px;margin-top:6px}
.g-main{padding:32px 40px 56px}
.g-wrap{max-width:1380px;gap:20px}
.g-h1{font-size:25px;letter-spacing:.3px}
.g-sub{font-size:13px;margin-top:4px;color:#5B6773}
.g-card,.g-kpi,.g-tablebox{border-radius:12px;border-color:#DFE5EA;box-shadow:0 1px 2px rgba(11,61,97,.05),0 4px 14px rgba(11,61,97,.04)}
.g-card{padding:18px}
.g-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 16px}
.g-grid > .g-f.wide{grid-column:span 2}
.g-f .g-seg{align-self:flex-start}
table.g.quebra td{white-space:normal}
.g-f label,.g-f .l{font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:#5B6773}
.g-in{height:40px;border-color:#CED7DF;border-radius:9px;font-size:13.5px;transition:border-color .15s,box-shadow .15s}
.g-in:hover{border-color:#9FB0BF}
.g-in:focus{outline:none;border-color:#1C75BB;box-shadow:0 0 0 3px rgba(28,117,187,.15)}
.g-btn{height:40px;border-radius:9px;font-size:13px}
.g-btn:hover{background:#0E4B78}
.g-btn.out:hover{background:#EEF3F7}
.g-btn.lime:hover{background:#A9B83F}
.g-btn.sm{height:30px;border-radius:7px}
.g-seg{display:inline-flex;flex-wrap:nowrap;max-width:100%;overflow-x:auto}
.g-seg button{white-space:nowrap;padding:0 11px}
.g-seg button:hover:not(.on){background:#E2E8EE}
.g-kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.g-kpi{padding:16px 18px;gap:6px}
.g-kpi span{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase}
.g-kpi b{font-size:24px;letter-spacing:-.2px}
.g-tablebox .hd{padding:14px 18px;background:#FBFCFD}
table.g{font-size:13px}
table.g th{position:sticky;top:0;z-index:1;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#5B6773;padding:10px 12px;border-bottom:1px solid #DFE5EA;background:#F6F8FA}
table.g td{padding:10px 12px;border-top-color:#EEF2F5;white-space:nowrap}
table.g tbody tr:not(.aj):not(.dif):not(.falta):not(.sobra):not(.day):hover td{background:#F7FAFC}
.g-tabs{gap:6px}
.g-tabs button{padding:0 16px}
.g-radio{transition:border-color .15s,background-color .15s}
.g-radio:hover:not(.on){border-color:#9FB0BF}
@media (max-width: 960px){
  .g-app{grid-template-columns:1fr}
  .g-side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px}
  .g-side > div:first-child img{width:120px!important}
  .g-side > div:first-child span{display:none}
  .g-side nav{flex-direction:row;overflow-x:auto;order:3;flex-basis:100%;gap:4px}
  .g-side nav button{flex-shrink:0;border-left:0;border-bottom:3px solid transparent;border-radius:8px}
  .g-side nav button.on{border-bottom-color:#B6C54C}
  .g-side .g-sec,.g-side > div[style*="flex:1"]{display:none}
  .g-main{padding:20px 16px 40px}
  .g-grid > .g-f.wide{grid-column:auto}
}
</style>
</head>

}

function reduzirImagem(file, max, cb) {

ACOES.recSalvar = function () {
  var R = S.R, cod = document.getElementById('rCod').value, n1 = document.getElementById('rNova').value, n2 = document.getElementById('rNova2').value;
  if (cod.replace(/\D/g, '').length !== 6) return toast('Digite os 6 números do código.', true);

  if (R.tipo === 'GESTAO' && n1.length < 6) return toast('A senha nova precisa ter pelo menos 6 caracteres.', true);
  if (n1 !== n2) return toast('As duas senhas não são iguais.', true);
  call('redefinirSenha', { tipo: R.tipo, login: R.login, codigo: cod, nova: n1 }).then(function () {
    var tela = R.tipo === 'GESTAO' ? 'glogin' : 'login', login = R.login; S.R = null; ir(tela);

var ST_TXT = { OK: 'CONFERE', VALOR_DIFERENTE: 'VALOR DIFERENTE', FALTA_SISTEMA: 'FALTA NO SISTEMA', A_MAIS_SISTEMA: 'A MAIS NO SISTEMA' };
var ST_CLS = { OK: '', VALOR_DIFERENTE: 'dif', FALTA_SISTEMA: 'falta', A_MAIS_SISTEMA: 'sobra' };
function mostrarConf() {
  var c = S.G.conf, t = c.totais, box = document.getElementById('cRes'); if (!box) return;
  var filtro = S.G.cFiltro || 'todas';
  document.getElementById('cBtns').innerHTML = '<button class="g-btn" data-a="cCheia">' + I.cheia + ' Tela cheia (PDF)</button>';
  var linhas = c.linhas.filter(function (l) { return filtro === 'todas' || l.status !== 'OK'; });
  var dias = {}, ordem = [];
  linhas.forEach(function (l) { if (!dias[l.data]) { dias[l.data] = []; ordem.push(l.data); } dias[l.data].push(l); });
  var dec = function (l) {
    if (!master()) return '';
    var b = function (v, txt) { return '<button class="g-btn sm' + (l.decisao === v ? '' : ' out') + '" data-a="cDecidir" data-k="' + l.chave + '" data-v="' + (l.decisao === v ? '' : v) + '">' + txt + '</button>'; };
    var out = '';
    if (l.status === 'VALOR_DIFERENTE') out = b('ROMANEIO', 'Romaneio ' + br(l.rom.valor_final)) + ' ' + b('SISTEMA', 'Sistema ' + br(l.sis.valor));
    if (l.status === 'FALTA_SISTEMA') out = b('PAGAR', 'Pagar ' + br(l.rom.valor_final)) + ' ' + b('NAO_PAGAR', 'Não pagar');
    if (l.status === 'A_MAIS_SISTEMA') out = b('MANTER', 'Manter ' + br(l.sis.valor)) + ' ' + b('RETIRAR', 'Retirar');
    if (l.rom) out += ' ' + (l.rom.diaAberto ? '<span style="font-size:11px;color:#5B6773">Dia aberto</span>' : '<button class="g-btn sm out" style="border-color:#E8A33D;color:#8A5300" data-a="gAjustar" data-id="' + l.rom.id + '" data-v="' + l.rom.valor_final + '" data-conf="' + c.id + '">' + I.lapis + ' ' + (l.rom.ajustado ? 'Reajustar' : 'Ajustar') + '</button>');
    return out;
  };

    '<section class="g-tablebox"><div class="hd"><div class="g-seg"><button class="' + (filtro === 'todas' ? 'on' : '') + '" data-a="cFiltro" data-v="todas">Todas (' + c.linhas.length + ')</button><button class="' + (filtro === 'div' ? 'on' : '') + '" data-a="cFiltro" data-v="div">Só divergências (' + t.divergencias + ')</button></div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;font-weight:700;color:#3E4A55">' + Object.keys(ST_TXT).map(function (k) { return '<span class="g-chip st-' + k + '">' + ST_TXT[k] + '</span>'; }).join('') + '</div></div>' +
    '<div class="g-scroll"><table class="g" style="min-width:1080px"><thead><tr><th>Hora</th><th>Contêiner</th><th>OS</th><th>Origem → destino</th><th>Tipo</th><th class="n">Romaneio</th><th class="n">Sistema</th><th>Situação</th><th>Decisão / ajuste</th></tr></thead><tbody>' +
    ordem.map(function (d) {
      return '<tr class="day"><td colspan="9">' + dow(d) + ' ' + dBrA(d) + ' · ' + dias[d].length + ' linha(s)</td></tr>' + dias[d].map(function (l) {
        var r = l.rom, s = l.sis;
        var rota = r ? (r.categoria === 'CONTEINER' ? r.origem + ' → ' + r.destino : r.tipo_extra) : (s.origem ? s.origem + ' → ' + s.destino : s.tipo);
        var tipo = r ? (r.categoria === 'CONTEINER' ? r.carga : r.tipo_extra) : s.tipo;
        return '<tr class="' + (r && r.ajustado ? 'aj' : ST_CLS[l.status]) + '"><td><b>' + esc(l.hora) + '</b></td><td style="white-space:nowrap"><b>' + esc((r && r.conteiner) || (s && s.conteiner) || '—') + '</b></td><td>' + esc(s ? s.os : '—') + '</td><td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(rota) + '">' + esc(rota) + '</td><td>' + esc(tipo) + '</td>' +
          '<td class="n">' + (r ? (r.ajustado ? '<span style="text-decoration:line-through;color:#5B6773;font-size:11px">' + br(r.valor_lancado) + '</span><br><b style="color:#8A5300">' + br(r.valor_final) + '</b>' : '<b>' + br(r.valor_final) + '</b>') : '—') + '</td><td class="n"><b>' + (s ? br(s.valor) : '—') + '</b></td>' +

      }).join('');
    }).join('') + '</tbody></table></div></section>';
}

function filtroAtivo(aba) { S.G.ativoFiltro = S.G.ativoFiltro || {}; return S.G.ativoFiltro[aba] || 'ativos'; }
function segAtivos(aba, lista) {

  return '<div class="g-seg" role="tablist" aria-label="Ativos ou inativos"><button role="tab" aria-selected="' + (f === 'ativos') + '" class="' + (f === 'ativos' ? 'on' : '') + '" data-a="cadFiltroAtivo" data-aba="' + aba + '" data-v="ativos">Ativos (' + a + ')</button>' +
    '<button role="tab" aria-selected="' + (f === 'inativos') + '" class="' + (f === 'inativos' ? 'on' : '') + '" data-a="cadFiltroAtivo" data-aba="' + aba + '" data-v="inativos">Inativos (' + i + ')</button></div>';
}
function soDoFiltro(aba, lista) { var f = filtroAtivo(aba); return lista.filter(function (x) { return f === 'ativos' ? x.ativo : !x.ativo; }); }
function linhaVazia(cols, aba) { return '<tr><td colspan="' + cols + '" style="text-align:center;color:#5B6773;padding:22px">' + (filtroAtivo(aba) === 'ativos' ? 'Nenhum cadastro ativo.' : 'Nenhum cadastro inativo.') + '</td></tr>'; }
ACOES.cadFiltroAtivo = function (d) {

  if (d.aba === 'usu') desenharUsu(S.G.usus || []);

ACOES.motAtivar = function (d) {

};
ACOES.usuAtivar = function (d) {

};

    '<div class="g-f wide"><span class="l">Agrupar</span><div class="g-seg">' + seg + '</div></div><div><button class="g-btn" data-a="kmBuscar">Buscar</button></div></section>' +
    '<div id="kmRes"><div class="g-card">Carregando…</div></div>');
};
TELAS.gkm.depois = function () {
  Promise.all([gMotoristasCache(), gVeiculosCache()]).then(function () {
    var a = document.getElementById('kPlacaBox'), b = document.getElementById('kMotBox');

};
function selVeiculo(id, sel) {
  return '<select id="' + id + '" class="g-in"><option value="">Todos os veículos</option>' + (S.G.veis || []).filter(function (v) { return v.tipo !== 'PROPRIO'; }).map(function (v) { return '<option value="' + esc(v.placa) + '"' + (v.placa === sel ? ' selected' : '') + '>' + esc(v.placa) + (v.frota ? ' · ' + esc(v.frota) : '') + '</option>'; }).join('') + '</select>';
}
ACOES.kmPor = function (d) { S.G.kmPor = d.v; document.querySelectorAll('[data-a="kmPor"]').forEach(function (b) { b.classList.toggle('on', b.dataset.v === d.v); }); if (S.G.kmLista) desenharKm(); };
ACOES.kmBuscar = function () {
  var p = lerPeriodo('k'), pl = document.getElementById('kPlaca'), mo = document.getElementById('kMot');
  S.G.kmPlaca = pl ? pl.value : S.G.kmPlaca; S.G.kmMot = mo ? mo.value : S.G.kmMot;
  call('gKm', { de: p.de, ate: p.ate, placa: S.G.kmPlaca || '', motorista_id: S.G.kmMot || '' }, true).then(function (l) { S.G.kmLista = l; desenharKm(); }).catch(falha);
};
function desenharKm() {
  var box = document.getElementById('kmRes'); if (!box) return;
  var l = S.G.kmLista, por = S.G.kmPor;
  var grupos = {}, ordem = [];
  l.forEach(function (k) { var g = por === 'placa' ? k.placa : k.motorista; if (!grupos[g]) { grupos[g] = []; ordem.push(g); } grupos[g].push(k); });
  ordem.sort();
  var rod = l.reduce(function (s, k) { return s + (k.momento === 'ENCERRAMENTO' && k.rodado > 0 ? k.rodado : 0); }, 0);
  var alertas = l.filter(function (k) { return k.alertas.length; }).length, alt = l.filter(function (k) { return k.alterado; }).length;
  var veis = {}; l.forEach(function (k) { veis[k.placa] = 1; });
  box.innerHTML = '<section class="g-kpis" style="margin-bottom:16px"><div class="g-kpi"><span>Registros (fotos)</span><b>' + l.length + '</b></div><div class="g-kpi"><span>Veículos</span><b>' + Object.keys(veis).length + '</b></div>' +
    '<div class="g-kpi navy"><span>KM rodado no período</span><b>' + fmtKm(rod) + ' km</b></div><div class="g-kpi warn"><span>Com alerta · corrigidos</span><b>' + alertas + ' · ' + alt + '</b></div></section>' +
    (ordem.length ? ordem.map(function (g) {
      var it = grupos[g], tot = it.reduce(function (s, k) { return s + (k.momento === 'ENCERRAMENTO' && k.rodado > 0 ? k.rodado : 0); }, 0);
      var veic = por === 'placa' ? (S.G.veis || []).filter(function (v) { return v.placa === g; })[0] : null;
      return '<section class="g-tablebox" style="margin-bottom:16px"><div class="hd"><div style="display:flex;align-items:center;gap:10px">' + (por === 'placa' ? '<span class="g-chip" style="background:#0B3D61;color:#fff;font-size:12px;letter-spacing:1px">' + esc(g) + '</span><span style="font-size:13px;color:#5B6773">' + esc(veic ? [veic.frota, veic.descricao].filter(Boolean).join(' · ') : '') + '</span>' : '<b>' + esc(g) + '</b>') + '</div><b>' + it.length + ' registro(s) · ' + fmtKm(tot) + ' km rodados</b></div>' +
        '<div class="g-scroll"><table class="g" style="min-width:960px"><thead><tr><th>Dia</th><th>Foto tirada em</th><th>Momento</th><th>' + (por === 'placa' ? 'Motorista' : 'Veículo') + '</th><th class="n">KM</th><th class="n">Rodado</th><th>Foto</th><th>Alertas</th><th></th></tr></thead><tbody>' +
        it.map(function (k) {
          return '<tr class="' + (k.alterado ? 'aj' : k.alertas.length ? 'dif' : '') + '"><td>' + dBrA(k.data_operacional) + '</td><td>' + esc(k.registrado_em.slice(8, 10) + '/' + k.registrado_em.slice(5, 7) + ' ' + k.registrado_em.slice(11)) + '</td>' +
            '<td><span class="g-chip" style="background:' + (k.momento === 'ABERTURA' ? '#E8F2FA;color:#145A90' : '#F1F4D6;color:#4A5200') + '">' + k.momento + '</span></td><td>' + (por === 'placa' ? esc(k.motorista) : '<b>' + esc(k.placa) + '</b>') + '</td>' +
            '<td class="n">' + (k.alterado && k.km !== k.km_original ? '<span style="text-decoration:line-through;color:#5B6773;font-size:11px">' + fmtKm(k.km_original) + '</span><br>' : '') + '<b style="' + (k.alterado ? 'color:#8A5300' : '') + '">' + fmtKm(k.km) + '</b></td>' +
            '<td class="n">' + (k.momento === 'ENCERRAMENTO' && k.rodado !== undefined ? fmtKm(k.rodado) + ' km' : '–') + '</td>' +
            '<td><button class="g-btn sm out" data-a="kmVerFoto" data-id="' + k.id + '">Ver foto</button>' + (k.foto_alterada ? ' <span class="g-chip" style="background:#E8A33D;color:#3D2600">TROCADA</span>' : '') + '</td>' +
            '<td style="max-width:260px;white-space:normal;font-size:11px;color:#8A5300">' + k.alertas.map(esc).join('<br>') + (k.alterado ? '<div><span class="g-chip" style="background:#8A5300;color:#fff">CORRIGIDO · ' + k.log.length + ' alteração(ões)</span></div>' : '') + '</td>' +
            '<td>' + (master() ? '<button class="g-btn sm out" style="border-color:#E8A33D;color:#8A5300" data-a="kmAlterar" data-id="' + k.id + '">' + I.lapis + ' Corrigir</button>' : (k.log.length ? '<button class="g-btn sm out" data-a="kmAlterar" data-id="' + k.id + '">Histórico</button>' : '')) + '</td></tr>';
        }).join('') + '</tbody></table></div></section>';
    }).join('') : '<div class="g-card" style="text-align:center;color:#5B6773">Nenhum registro de KM nesse filtro.</div>');
}
function kmPorId(id) { return (S.G.kmLista || []).filter(function (k) { return k.id === id; })[0]; }
function carregarFoto(fotoId, alvo) {
  S.G.fotos = S.G.fotos || {};
  var por = function (r) { var el = document.getElementById(alvo); if (el) el.innerHTML = '<img src="' + r.dataUrl + '" alt="Foto do painel" style="width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:#000"><div style="font-size:11px;color:#5B6773;margin-top:4px">Arquivo criado em ' + esc(r.criada) + '</div>'; };
  if (S.G.fotos[fotoId]) return por(S.G.fotos[fotoId]);
  call('gFoto', { id: fotoId }, true).then(function (r) { S.G.fotos[fotoId] = r; por(r); }).catch(function (e) { var el = document.getElementById(alvo); if (el) el.textContent = e.message; });
}
ACOES.kmVerFoto = function (d) {
  var k = kmPorId(d.id); if (!k) return;
  abrirModal('<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">' + esc(k.placa) + ' · ' + k.momento + ' · ' + fmtKm(k.km) + ' km</b><button class="g-btn sm out" data-a="fecharModal">Fechar</button></div>' +
    '<div style="font-size:13px;color:#3E4A55">' + esc(k.motorista) + ' · ' + dBrA(k.data_operacional) + ' · foto tirada em ' + esc(k.registrado_em.slice(11)) + '</div><div id="fotoBox" style="min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5B6773">Carregando foto…</div>');
  carregarFoto(k.foto_id, 'fotoBox');
};
ACOES.kmAlterar = function (d) {
  var k = kmPorId(d.id); if (!k) return;
  S.G.kmEd = { id: k.id, foto: null };
  var hist = k.log.length ? '<div style="border-top:1px solid #DCE2E8;padding-top:10px;display:flex;flex-direction:column;gap:6px"><b style="font-size:13px">Histórico de alterações</b>' + k.log.map(function (h) {
    return '<div style="font-size:12px;background:#FFF6E6;border-radius:8px;padding:6px 8px"><b>' + esc(h.data) + ' · ' + esc(h.usuario) + '</b><br>' + (h.campo === 'KM' ? 'KM: ' + fmtKm(h.de) + ' → ' + fmtKm(h.para) : 'Foto trocada') + '<br><i>' + esc(h.motivo) + '</i></div>';
  }).join('') + '</div>' : '';
  if (!master()) return abrirModal('<b style="font-size:16px">Histórico · ' + esc(k.placa) + '</b>' + hist + '<button class="g-btn" style="justify-content:center" data-a="fecharModal">Fechar</button>');
  abrirModal('<b style="font-size:17px">Corrigir KM · ' + esc(k.placa) + ' · ' + k.momento + '</b><div style="font-size:13px;color:#3E4A55">' + esc(k.motorista) + ' · ' + dBrA(k.data_operacional) + '</div>' +
    '<div id="fotoBox" style="min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5B6773">Carregando foto…</div>' +
    '<div class="g-f"><label for="kmNovo">KM correto</label><input id="kmNovo" class="g-in" inputmode="numeric" value="' + fmtKm(k.km) + '" data-i="kmMasc"></div>' +
    '<div class="g-f"><span class="l">Foto correta (opcional)</span><button class="g-btn out" data-a="kmNovaFoto" id="kmNovaFotoBtn" style="justify-content:center">Escolher outra foto</button></div>' +
    '<div class="g-f"><label for="kmMotivo">Motivo da correção *</label><textarea id="kmMotivo" class="g-in" rows="2" style="height:auto;padding:8px 10px" placeholder="Ex.: motorista digitou errado, o painel mostra 254.380"></textarea></div>' +
    '<div style="font-size:12px;color:#8A5300;background:#FFF6E6;border-radius:8px;padding:8px 10px">O valor e a foto enviados pelo motorista ficam guardados. A correção vai para o histórico com seu usuário, data e motivo.</div>' +
    '<div style="display:flex;gap:8px"><button class="g-btn out" style="flex:1;justify-content:center" data-a="fecharModal">Cancelar</button><button class="g-btn" style="flex:1;justify-content:center" data-a="kmSalvarAlt">Salvar correção</button></div>' + hist);
  carregarFoto(k.foto_id, 'fotoBox');
};
ACOES.kmMasc = function (d, el) { var v = el.value.replace(/\D/g, '').slice(0, 7); el.value = v ? fmtKm(v) : ''; };
ACOES.kmNovaFoto = function () {
  var f = document.getElementById('arquivo'); f.accept = 'image/*'; f.value = '';
  f.onchange = function () {
    if (!f.files[0]) return;
    reduzirImagem(f.files[0], 1600, function (u) {
      S.G.kmEd.foto = u;
      var b = document.getElementById('fotoBox'); if (b) b.innerHTML = '<img src="' + u + '" alt="Nova foto" style="width:100%;max-height:50vh;object-fit:contain;border-radius:10px;background:#000"><div style="font-size:11px;color:#8A5300;margin-top:4px">Nova foto (ainda não salva)</div>';
      document.getElementById('kmNovaFotoBtn').textContent = 'Trocar de novo';
    });
  };
  f.click();
};
ACOES.kmSalvarAlt = function () {
  var k = kmPorId(S.G.kmEd.id), km = document.getElementById('kmNovo').value.replace(/\D/g, '');
  call('gAjustarKm', { id: k.id, km: +km !== k.km ? km : '', fotoBase64: S.G.kmEd.foto, motivo: document.getElementById('kmMotivo').value })
    .then(function () { fecharModal(); toast('Correção salva no histórico.'); ACOES.kmBuscar(); }).catch(falha);
};

/* ---------- Relatórios ---------- */
TELAS.grel = function () {
  var R = S.G.rel || (S.G.rel = { tipo: 'geral', formato: 'pdf', vinculo: 'TODOS' });
  var rd = function (t, tit, txt) { return '<button class="g-radio' + (R.tipo === t ? ' on' : '') + '" data-a="relTipo" data-v="' + t + '"><b style="font-size:16px">' + tit + '</b><span style="font-size:12px;color:#3E4A55;line-height:1.45">' + txt + '</span></button>'; };
  var vs = ['TODOS', 'AVULSO', 'CLT', 'AGREGADO'].map(function (v) { return '<button class="' + (R.vinculo === v ? 'on' : '') + '" data-a="relVinc" data-v="' + v + '">' + v + '</button>'; }).join('');
  var fm = function (f, n) { return '<button class="g-radio' + (R.formato === f ? ' on' : '') + '" style="min-height:52px;flex:0 1 200px;justify-content:center" data-a="relFmt" data-v="' + f + '"><b style="font-size:13px">' + n + '</b></button>'; };
  return gLayout('grel', '<div><h1 class="g-h1">RELATÓRIOS</h1><div class="g-sub">Escolha o tipo de relatório, o período e o formato.</div></div>' +
    '<section class="g-card" style="display:flex;flex-direction:column;gap:12px"><b>1. Qual relatório?</b><div style="display:flex;flex-wrap:wrap;gap:12px">' +
    rd('geral', 'Relatório geral', 'Todos os motoristas no período, um por linha, com Batendo, Cheio, Vazio e Valor total. Mesmo modelo do relatório da ModallPort.') +
    rd('individual', 'Relatório individual', 'Um motorista: todas as operações dia a dia, com subtotal por dia, resumo por tipo e total do período.') + '</div></section>' +
    '<section class="g-card" style="display:flex;flex-direction:column;gap:12px"><b>2. Filtros</b><div class="g-grid">' + periodoCampos('r') +
    (R.tipo === 'geral' ? '<div class="g-f wide"><span class="l">Vínculo</span><div class="g-seg">' + vs + '</div></div>' : '<div class="g-f"><label for="rMot">Motorista</label><span id="rMotBox">' + selMotorista('rMot', S.G.motId) + '</span></div>') + '</div></section>' +
    '<section class="g-card" style="display:flex;flex-direction:column;gap:12px"><b>3. Formato</b><div style="display:flex;flex-wrap:wrap;gap:10px">' + fm('pdf', 'PDF · para imprimir') + fm('xlsx', 'EXCEL · para conferir') + '</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:10px"><button class="g-btn out" data-a="relGerar" data-modo="html">' + I.cheia + ' Ver em tela cheia</button><button class="g-btn" data-a="relGerar" data-modo="baixar">' + I.baixar + ' Baixar</button></div></section>');
};
TELAS.grel.depois = function () { gMotoristasCache().then(function () { var b = document.getElementById('rMotBox'); if (b) b.innerHTML = selMotorista('rMot', S.G.motId); }); };
ACOES.relTipo = function (d) { lerPeriodo('r'); S.G.rel.tipo = d.v; render(); };
ACOES.relVinc = function (d) { lerPeriodo('r'); S.G.rel.vinculo = d.v; render(); };
ACOES.relFmt = function (d) { lerPeriodo('r'); var m = document.getElementById('rMot'); if (m) S.G.motId = m.value; S.G.rel.formato = d.v; render(); };
ACOES.relGerar = function (d) {
  var R = S.G.rel, p = lerPeriodo('r'), a = { tipo: R.tipo, de: p.de, ate: p.ate, vinculo: R.vinculo, formato: d.modo === 'html' ? 'html' : R.formato };
  if (R.tipo === 'individual') { a.motorista_id = document.getElementById('rMot').value; if (!a.motorista_id) return toast('Escolha o motorista.', true); S.G.motId = a.motorista_id; }
  gerarRelatorio(a);
};
function gerarRelatorio(a) {
  call('gRelatorio', a).then(function (r) {
    if (r.html) {
      S.G.ultimoRel = a;
      document.getElementById('layer').innerHTML = '<div class="full"><div class="bar"><b>' + esc(r.nome.replace(/_/g, ' ')) + '</b><button class="g-btn sm out" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)" data-a="relImprimir">Imprimir</button><button class="g-btn sm lime" data-a="relBaixarDe" data-f="pdf">' + I.baixar + ' PDF</button><button class="g-btn sm lime" data-a="relBaixarDe" data-f="xlsx">' + I.baixar + ' Excel</button><button class="ic-btn" data-a="fecharModal" aria-label="Fechar">' + I.fechar + '</button></div><iframe id="relFrame" title="Relatório"></iframe></div>';
      document.getElementById('relFrame').srcdoc = r.html;
    } else baixarArquivo(r);
  }).catch(falha);
}
ACOES.relImprimir = function () { var f = document.getElementById('relFrame'); if (f) f.contentWindow.print(); };
ACOES.relBaixarDe = function (d) { var a = JSON.parse(JSON.stringify(S.G.ultimoRel)); a.formato = d.f; gerarRelatorio(a); };
function baixarArquivo(r) {
  try {
    var bin = atob(r.base64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
    var a = document.createElement('a'); a.href = url; a.download = r.nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('Arquivo baixado: ' + r.nome);
  } catch (e) { toast('Não consegui baixar o arquivo.', true); }
}

 * INÍCIO
 * ======================================================= */
aplicarTema();
if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema); } catch (e) { } }
(function iniciar() {
  var gestao = location.hash === '#gestao' || ls('rd_tipo') === 'GESTAO';
  if (!S.token) return ir(gestao ? 'glogin' : 'login');
  call('quemSou').then(function (r) {
    if (r.tipo === 'GESTAO') { S.G.user = r; ir('gpainel'); gPreCarregar(); } else carregarEstado();
  }).catch(function () { ir(gestao ? 'glogin' : 'login'); });
})();
