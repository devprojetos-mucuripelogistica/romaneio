<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Romaneio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<title>Romaneio Digital – Mucuripe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--surface2:#F7F9FA;--line:#DCE2E8;--ink:#0B3D61;--ink2:#3E4A55;--muted:#5B6773;
  --header:#0B3D61;--primary:#0B3D61;--onprimary:#FFFFFF;--accent:#B6C54C;--accentSoft:#F1F4D6;--accentText:#4A5200;
  --blue:#1C75BB;--blueSoft:#E8F2FA;--blueText:#145A90;--warn:#E8A33D;--warnSoft:#FFF6E6;--warnText:#8A5300;
  --pin:#C2410C;--selBg:#F1F4D6;--selLine:#0B3D61;--chip:#E6EAEE;--bar:#1C75BB;--barSoft:#A9CBE8;--fs:1;
  color-scheme: light;
}
:root[data-theme="escuro"]{
  --bg:#09141D;--surface:#112230;--surface2:#0D1B27;--line:#243848;--ink:#E9EFF4;--ink2:#C2CEDA;--muted:#93A4B3;
  --header:#0B2A42;--primary:#B6C54C;--onprimary:#0B2238;--accentSoft:#232D0E;--accentText:#D2DD7C;
  --blue:#5AA9E6;--blueSoft:#0F2E47;--blueText:#A6D0F2;--warnSoft:#33240C;--warnText:#F4C57E;--pin:#F27C4B;
  --selBg:#1E2A10;--selLine:#B6C54C;--chip:#1B2D3B;--bar:#5AA9E6;--barSoft:#2C5374;color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="sistema"]{
    --bg:#09141D;--surface:#112230;--surface2:#0D1B27;--line:#243848;--ink:#E9EFF4;--ink2:#C2CEDA;--muted:#93A4B3;
    --header:#0B2A42;--primary:#B6C54C;--onprimary:#0B2238;--accentSoft:#232D0E;--accentText:#D2DD7C;
    --blue:#5AA9E6;--blueSoft:#0F2E47;--blueText:#A6D0F2;--warnSoft:#33240C;--warnText:#F4C57E;--pin:#F27C4B;
    --selBg:#1E2A10;--selLine:#B6C54C;--chip:#1B2D3B;--bar:#5AA9E6;--barSoft:#2C5374;color-scheme: dark;
  }
}
:root[data-letra="grande"]{--fs:1.15}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-size:calc(15px*var(--fs));-webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--ink);background:var(--surface)}
input::placeholder{color:var(--muted)}
.hidden{display:none!important}

/* ---------- App do motorista ---------- */
.m-app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.m-head{position:sticky;top:0;z-index:5;height:calc(60px + env(safe-area-inset-top));flex-shrink:0;background:var(--header);border-bottom:3px solid var(--accent);color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;padding-top:env(safe-area-inset-top)}
.m-head h1{flex:1;margin:0 0 0 8px;font-family:'Exo 2',sans-serif;font-style:italic;font-size:19px;font-weight:800;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-btn{width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.ic-btn.plain{border:0;background:transparent}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#0B2238;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.m-body{flex:1;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.m-app.tt{--tabsH:calc(62px + env(safe-area-inset-bottom))}
.m-app.tt > .m-foot{padding-bottom:14px}
.m-foot{position:sticky;bottom:var(--tabsH,0px);z-index:4;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.tabs{position:sticky;bottom:0;z-index:5;height:calc(62px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-width:0;padding:0 1px;border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-top:3px solid transparent}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width: 370px){.tabs button{font-size:8.5px;letter-spacing:-.1px}}
.tabs button.on{color:var(--ink);font-weight:800;border-top-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.dark-card{background:#0B3D61;color:#fff;border-radius:14px;padding:14px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.q{font-size:calc(20px*var(--fs));font-weight:800;line-height:1.25;margin:0}
.btn{height:56px;border-radius:14px;border:0;background:var(--primary);color:var(--onprimary);font-size:17px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.btn.lime{background:#B6C54C;color:#0B2238}
.btn.out{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{height:44px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wiz-foot{display:flex;gap:10px}
.wiz-foot .back{width:56px;flex-shrink:0;height:56px;border-radius:14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center}
.prog{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.prog .t{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.5px}
.prog .segs{display:grid;gap:4px}
.prog .segs span{height:6px;border-radius:3px;background:var(--line)}
.prog .segs span.d{background:var(--ink)}
.prog .segs span.c{background:#8FA02A}
.field{height:56px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font-size:19px;font-weight:700;width:100%}
.field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blueSoft)}
.field.big{height:64px;font-size:22px;font-weight:800;letter-spacing:.5px}
.opt{border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.opt.on{border:3px solid var(--selLine);background:var(--selBg)}
.opt.col{flex-direction:column;justify-content:center;text-align:center;gap:12px}
.ico-sq{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.3px}
.chip.blue{background:var(--blueSoft);color:var(--blueText)}
.chip.lime{background:var(--accentSoft);color:var(--accentText)}
.chip.gray{background:var(--chip);color:var(--ink2)}
.chip.warn{background:#E8A33D;color:#3D2600}
.plate{border:1.5px solid var(--ink);border-radius:6px;padding:0 7px;font-weight:800;letter-spacing:1.2px;white-space:nowrap}
.info{display:flex;gap:8px;background:var(--blueSoft);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;color:var(--ink)}
.warnbox{display:flex;gap:8px;background:var(--warnSoft);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;color:var(--warnText)}
.item{display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.item.aj{background:var(--warnSoft);border:2px solid var(--warn)}
.item .t1{font-size:14px;font-weight:800;letter-spacing:.3px}
.item .t2{font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t3{font-size:11px;font-weight:600;color:var(--muted)}
.item .v{font-size:15px;font-weight:800;flex-shrink:0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:24px;font-weight:800}
.keypad button.f{background:var(--chip);font-size:13px}
.timebox{display:flex;align-items:center;gap:10px}
.timebox input{flex:1;min-width:0;height:64px;border-radius:12px;border:1.5px solid var(--ink);text-align:center;font-size:34px;font-weight:800}
.sug{min-height:60px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}
.bars{position:relative;height:150px;display:grid;gap:6px;align-items:end;border-bottom:1px solid var(--line)}
.bars .b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.bars .b span{font-size:10px;font-weight:700;color:var(--ink2)}
.bars .b div{width:100%;max-width:30px;border-radius:4px 4px 0 0;background:var(--bar)}
.hbar{display:grid;grid-template-columns:62px 1fr 76px;align-items:center;gap:8px;font-size:12px}
.hbar .tr{height:14px;border-radius:4px;background:var(--chip);overflow:hidden}
.hbar .tr div{height:100%;border-radius:4px;background:var(--bar)}
.switch{width:48px;height:28px;border-radius:14px;border:0;background:var(--chip);padding:3px;display:flex;justify-content:flex-start}
.switch span{width:22px;height:22px;border-radius:11px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on{background:var(--primary);justify-content:flex-end}
.switch.on span{background:var(--onprimary)}
.seg{display:grid;gap:4px;padding:3px;border-radius:10px;background:var(--chip)}
.seg button{height:40px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.login-hero{background:var(--header);color:#fff;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));position:relative}
.login-sheet{flex:1;background:var(--surface);border-radius:24px 24px 0 0;margin-top:-20px;padding:26px 20px 24px;display:flex;flex-direction:column;gap:16px}

/* ---------- Gestão ---------- */
.g-app{min-height:100vh;display:flex;flex-wrap:wrap;background:#F3F5F7;color:#0B3D61}
.g-side{flex:1 1 220px;max-width:100%;background:#0B3D61;color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.g-side nav{display:flex;flex-direction:column;gap:2px}
.g-side nav button{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:10px;color:#D5E0EA;font-size:14px;font-weight:600;border:0;border-left:3px solid transparent;background:transparent;text-align:left}
.g-side nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700;border-left-color:#B6C54C}
.g-main{flex:999 1 640px;min-width:0;padding:24px 28px 40px}
.g-wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.g-h1{margin:0;font-family:'Exo 2',sans-serif;font-style:italic;font-weight:800;font-size:26px;letter-spacing:.5px}
.g-sub{font-size:13px;color:#5B6773}
.g-card{background:#fff;border:1px solid #DCE2E8;border-radius:12px;padding:14px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.g-f{display:flex;flex-direction:column;gap:6px}
.g-f label,.g-f .l{font-size:11px;font-weight:700;color:#5B6773}
.g-in{height:40px;border:1px solid #C9D2DA;border-radius:10px;padding:0 10px;font-size:13px;color:#0B3D61;background:#fff;width:100%}
.g-btn{height:40px;padding:0 14px;border-radius:10px;border:0;background:#0B3D61;color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.g-btn.out{background:#fff;color:#0B3D61;border:1.5px solid #0B3D61}
.g-btn.lime{background:#B6C54C;color:#0B2238}
.g-btn.sm{height:30px;padding:0 9px;font-size:11px;border-radius:8px}
.g-btn:disabled{opacity:.45;cursor:default}
.g-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.g-kpi{background:#fff;border:1px solid #DCE2E8;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.g-kpi span{font-size:11px;font-weight:700;color:#5B6773}
.g-kpi b{font-size:22px}
.g-kpi.navy{background:#0B3D61;color:#fff;border-color:#0B3D61}.g-kpi.navy span{color:#C9D6E2}.g-kpi.navy b{color:#B6C54C}
.g-kpi.warn{background:#FFF6E6;border-color:#E8A33D;color:#8A5300}.g-kpi.warn span{color:#8A5300}
.g-tablebox{background:#fff;border:1px solid #DCE2E8;border-radius:12px;overflow:hidden}
.g-tablebox .hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid #DCE2E8}
.g-scroll{overflow-x:auto}
.fbar{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;z-index:20}
.fbar-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;flex:1}
.fbar-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbtn,.xbtn{height:38px;padding:0 14px;font-size:13px}
.g-btn.fbtn.on,.g-btn.fbtn.on:hover{background:#0B3D61 !important;color:#fff !important;border-color:#0B3D61 !important}
.fseta{display:inline-flex;transition:transform .15s}
.fbtn.on .fseta,.xbtn.on .fseta{transform:rotate(180deg)}
.fresumo{display:flex;gap:6px;flex-wrap:wrap}
.fbusca{width:200px;height:38px}
.fchip{background:#EEF3F7;color:#264A66;border:1px solid #DCE5EC;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.fpop{position:absolute;left:0;top:calc(100% + 8px);width:min(760px,100%);background:#fff;border:1px solid #DCE2E8;border-radius:14px;padding:16px;box-shadow:0 18px 50px rgba(11,61,97,.18),0 2px 6px rgba(11,61,97,.08)}
.fpop.hidden,.xlista.hidden{display:none}
.fpop .g-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.xmenu{position:relative}
.xlista{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:#fff;border:1px solid #DCE2E8;border-radius:12px;padding:6px;box-shadow:0 18px 50px rgba(11,61,97,.18);z-index:30;display:flex;flex-direction:column}
.xitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;font:inherit;font-size:13px;font-weight:700;color:#0B3D61;cursor:pointer;text-align:left;white-space:nowrap}
.xitem:hover,.xitem:focus{background:#F1F4D6;outline:none}
@media (max-width:640px){.fpop{position:fixed;left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:80vh;overflow:auto;z-index:60}}
.km-tools{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-size:12px;color:#5B6773;font-weight:700}
.km-hd{cursor:pointer;user-select:none}
.km-hd:hover{background:#F2F6F9 !important}
.km-seta{display:inline-flex;transition:transform .15s;color:#5B6773}
.km-grupo.fechado .km-seta{transform:rotate(-90deg)}
.km-grupo.fechado .hd{border-bottom:0}
.cad-form{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;border-left:4px solid #C5D82E}
.cad-form-hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 14px}
.cad-sep{grid-column:1/-1;border-top:1px dashed #D5DCE3;padding-top:10px;font-size:13px;font-weight:800}
table.g.cad-tab td.cad-cut{max-width:200px;overflow:hidden;text-overflow:ellipsis}
table.g td.cad-acoes{white-space:nowrap;text-align:right;position:sticky;right:0;background:#fff;box-shadow:-8px 0 12px -10px rgba(11,61,97,.35)}
table.g tr:hover td.cad-acoes{background:#F7FAFC}
table.g.cad-tab th:last-child{position:sticky;right:0;z-index:2}
.vinc-CLT{background:#E8F2FA;color:#145A90}.vinc-AGREGADO{background:#F1F4D6;color:#5A6400}.vinc-AVULSO{background:#F3F0FA;color:#5B3FA0}
table.g{width:100%;border-collapse:collapse;font-size:12.5px}
table.g th{background:#F3F5F7;color:#3E4A55;font-size:11px;font-weight:800;padding:9px 8px;text-align:left;white-space:nowrap}
table.g td{padding:8px;border-top:1px solid #EDF0F2;vertical-align:middle}
table.g td.n,table.g th.n{text-align:right}
table.g tr.day td{background:#E9EEF2;font-weight:800}
table.g tr.aj td{background:#FFF1DA}
table.g tr.dif td{background:#FFF6E6}
table.g tr.falta td{background:#EEF5FC}
table.g tr.sobra td{background:#FDF0EA}
.offbar{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;padding:10px 14px;font-size:13px;line-height:1.35;font-family:inherit;position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:4}
.offbar svg{flex-shrink:0;width:20px;height:20px}
.offbar.off{background:#FFF1D6;color:#6B4100;border-bottom:1px solid #E8A33D}
.offbar.semnet{background:#EEF1F4;color:#3E4A55;border-bottom:1px solid #D5DCE3}
.offbar.env{background:#E3F0FA;color:#0F4A75;border-bottom:1px solid #9CC6E8}
.offbar.err{background:#FDE3DA;color:#8A2400;border-bottom:1px solid #E58A66}
.gira{width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:gira .8s linear infinite;flex-shrink:0}
@keyframes gira{to{transform:rotate(360deg)}}
.chip.pend{background:#FFF1D6;color:#6B4100}
.lado2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.lado2 > div{min-width:0;border-right:1px solid #DFE5EA}
.lado2 > div:last-child{border-right:0}
.lado2 table.g th,.lado2 table.g td{padding:8px 8px}
.lado-t{font-size:11px;font-weight:800;letter-spacing:.5px;color:#fff;background:#0B3D61;padding:6px 12px}
.lado-t.sis{background:#5B6773}
@media (max-width: 1100px){.lado2{grid-template-columns:1fr}.lado2 > div{border-right:0}}
.passo{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #EDF0F2}
.passo:last-child{border-bottom:0}
.passo .ic{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;font-size:14px}
.passo.ok .ic{background:#3F8F1F;color:#fff}
.passo.nok .ic{background:#FDE3DA;color:#C2410C;border:1.5px solid #E58A66}
.passo .tx{flex:1;font-size:13.5px;line-height:1.4}
.fech-in{width:110px;height:32px;border:1px solid #CED7DF;border-radius:8px;padding:0 8px;text-align:right;font-size:13px}
.msel{position:relative}

var PASSOS = { CONTEINER: ['num', 'origem', 'destino', 'tam', 'carga', 'hora', 'valor', 'rev'], EXTRA: ['tipo', 'hora', 'valor', 'rev'] };
ACOES.iniciarWiz = function (d) {
  var agora = new Date(), hm = pad(agora.getHours()) + ':' + pad(agora.getMinutes());
  S.W = { categoria: d.c, i: 0, conteiner: '', foto_id: '', origem: '', destino: '', tamanho: '', carga: '', tipo_extra: '', ini: hm, fim: '', cents: '', litros: '', thumb: '', placa: '', meiaNoite: false };
  if (d.c === 'ABAST' && !S.est.operacao) {
    S.W.escolheVeic = true;
    return callLeitura('veiculosAbast', {}).catch(function (e) {
      var d = dadosOff(), m = S.est.motorista, l = [];
      if (m.placa_propria) l.push({ placa: m.placa_propria, frota: '', descricao: 'Seu cavalo', proprio: true });
      (d.veiculos || []).forEach(function (v) { if (v.tipo === 'CASA' && v.placa !== m.placa_propria) l.push({ placa: v.placa, frota: v.frota, descricao: v.descricao, proprio: false }); });
      if (!l.length) throw e; return l;
    }).then(function (l) {
      S.W.veics = l;
      if (l.length === 1) S.W.placa = l[0].placa;
      else { var p = l.filter(function (v) { return v.proprio; })[0]; if (p && S.est.motorista.vinculo === 'AGREGADO') S.W.placa = p.placa; }
      ir('wiz');
    }).catch(falha);
  }
  ir('wiz');
};
function comTrajeto(t) { return (S.est.extrasComTrajeto || ['BATENDO']).indexOf(t) >= 0; }
/** Abastecimento: cupom obrigatório, menos para agregado no próprio cavalo. */
function abastExigeCupom() {
  var e = S.est;
  if (e.operacao && !S.W.escolheVeic) return e.exigeCupom;
  var m = e.motorista;
  return !(m.vinculo === 'AGREGADO' && S.W.placa && S.W.placa === String(m.placa_propria || '').toUpperCase());
}
function listaPassos() {
  if (S.W.categoria === 'ABAST') return (S.W.escolheVeic ? ['veic'] : []).concat(abastExigeCupom() ? ['cupom'] : []).concat(['litros', 'valor', 'rev']);
  if (S.W.categoria === 'EXTRA' && comTrajeto(S.W.tipo_extra)) return ['tipo', 'origem', 'destino', 'hora', 'valor', 'rev'];
  return PASSOS[S.W.categoria];
}
function diaWiz() { return S.est.operacao ? S.est.operacao.data_operacional : S.est.hoje; }
function passo() { return listaPassos()[S.W.i]; }
function irPasso(i) { S.W.i = i; ir('wiz'); }
function progresso() {
  var n = listaPassos().length - 1, i = S.W.i;
  if (i >= n) return '';
  var segs = ''; for (var k = 0; k < n; k++) segs += '<span class="' + (k < i ? 'd' : k === i ? 'c' : '') + '"></span>';
  var ref = S.W.categoria === 'CONTEINER' ? (S.W.conteiner || '') : S.W.categoria === 'ABAST' ? (+S.W.litros > 0 ? br(+S.W.litros / 100) + ' L' : '') : (S.W.tipo_extra || '');
  return '<div class="prog"><div class="t"><span style="color:var(--muted)">PASSO ' + (i + 1) + ' DE ' + n + (ref && i > 0 ? ' · ' + esc(ref) : '') + '</span><span style="color:var(--blueText)">DIA ' + dBr(diaWiz()) + '</span></div><div class="segs" style="grid-template-columns:repeat(' + n + ',1fr)">' + segs + '</div></div>';
}
function rodapeWiz(okLabel, okAcao, desab) {
  return '<div class="m-foot"><div class="wiz-foot"><button class="back" data-a="wizVoltar" aria-label="Passo anterior">' + I.voltar + '</button><button class="btn" id="btnOk" data-a="' + (okAcao || 'wizProx') + '"' + (desab ? ' disabled' : '') + '>' + (okLabel || 'PRÓXIMO') + ' ' + I.seta + '</button></div></div>';
}
ACOES.wizVoltar = function () { if (S.W.i === 0) ir(S.W.categoria === 'ABAST' ? 'combustivel' : 'novo'); else irPasso(S.W.i - 1); };
ACOES.wizProx = function () {
  var p = passo(), W = S.W;
  if (p === 'num') { var v = validarConteiner(W.conteiner); if (!v.completo) return toast('Digite as 4 letras e os 7 números do contêiner.', true); W.conteiner = v.formatado; }
  if ((p === 'origem' || p === 'destino')) { var el = document.getElementById('local'); W[p] = (el ? el.value : W[p]).trim().toUpperCase(); if (!W[p]) return toast('Digite o nome do lugar.', true); }
  if (p === 'tam' && !W.tamanho) return toast('Escolha 20 ou 40.', true);
  if (p === 'carga' && !W.carga) return toast('Escolha cheio ou vazio.', true);
  if (p === 'tipo' && !W.tipo_extra) return toast('Escolha o custo extra.', true);
  if (p === 'hora') {
    W.ini = document.getElementById('hIni').value; W.fim = document.getElementById('hFim').value;
    if (!W.ini || !W.fim) return toast('Preencha os dois horários.', true);
    var nomes = rotHora();
    if (W.fim === W.ini) { falar('O horário de ' + nomes[1].toLowerCase() + ' não pode ser igual ao de ' + nomes[0].toLowerCase() + '.'); return toast(nomes[1] + ' não pode ser igual a ' + nomes[0] + '.', true); }
    if (W.fim < W.ini && !W.meiaNoite) return perguntarMeiaNoite(nomes);
  }
  if (p === 'veic' && !W.placa) return toast('Escolha o veículo que você abasteceu.', true);
  if (p === 'valor' && !(+W.cents > 0)) return toast('Digite o valor.', true);
  if (p === 'cupom' && !W.foto_id) return toast('Tire a foto do cupom.', true);
  if (p === 'litros' && !(+W.litros > 0)) return toast('Digite quantos litros.', true);
  irPasso(W.i + 1);
};
/** Nome das duas caixas de hora: SAÍDA/CHEGADA (contêiner e batendo) ou COMEÇOU/TERMINOU. */
function rotHora() { var W = S.W; return W.categoria === 'CONTEINER' || comTrajeto(W.tipo_extra) ? ['SAÍDA', 'CHEGADA'] : ['COMEÇOU', 'TERMINOU']; }
/** Chegada antes da saída: só aceita se o motorista confirmar que passou da meia-noite. */
function perguntarMeiaNoite(n) {
  var W = S.W;
  falar('O horário de ' + n[1].toLowerCase() + ' está antes do horário de ' + n[0].toLowerCase() + '. Confira.');
  abrirModal('<b style="font-size:18px;color:var(--warnText)">Confira os horários</b>' +
    '<div style="font-size:15px;line-height:1.5"><b>' + n[0] + ': ' + esc(W.ini) + '</b><br><b>' + n[1] + ': ' + esc(W.fim) + '</b><br>O horário de ' + n[1] + ' está <b>antes</b> do horário de ' + n[0] + '.</div>' +
    '<button class="btn" data-a="fecharModal">' + I.lapis + ' CORRIGIR O HORÁRIO</button>' +
    '<button class="btn out sm" data-a="meiaNoiteSim">PASSOU DA MEIA-NOITE (' + n[1] + ' NO DIA SEGUINTE)</button>');
}
ACOES.meiaNoiteSim = function () { fecharModal(); S.W.meiaNoite = true; irPasso(S.W.i + 1); };
function datasHorario() { // regra: depois da meia-noite continua no mesmo dia operacional
  var op = S.est.operacao;
  if (!op) return { ini: '', fim: '', dIni: S.est.hoje, dFim: S.est.hoje };   // abastecimento sem operação
  var base = op.data_operacional, abertura = hh(op.aberta_em);
  var virou = hojeIso() > base; // já passou da meia-noite desde a abertura
  var dIni = virou && S.W.ini && S.W.ini < abertura ? addDia(base, 1) : base;
  var dFim = S.W.fim && S.W.fim < S.W.ini && S.W.meiaNoite ? addDia(dIni, 1) : dIni;
  return { ini: dIni + ' ' + S.W.ini, fim: dFim + ' ' + S.W.fim, dIni: dIni, dFim: dFim };
}

  if (st === 'ALTERADO') return '<span class="g-chip" style="background:#F8C08A;color:#5A2A00" title="Mudou depois da confirmação · ' + esc(por || '') + '">ALTERADO APÓS CONFERIR</span>';
  return '';
}
/** Confirma (ou desfaz) que a produção do motorista no dia foi conferida. */
/** Do Mapa/Produção para a aba Ajustes, já no motorista e no dia escolhidos. */

ACOES.confDia = function (d) {

};
ACOES.desconfDia = function (d) {

};

        '<td>' + (d.ajustes ? '<span class="g-chip" style="background:#E8A33D;color:#3D2600">' + d.ajustes + '</span>' : '–') + '</td><td><span style="font-size:12px;color:#145A90;font-weight:700">' + (ab ? 'Fechar' : 'Ver motoristas') + '</span></td></tr>';
      if (!ab) return linha;

          '<td class="n">' + cv(g.batendo) + '</td><td class="n">' + cv(g.cheio) + '</td><td class="n">' + cv(g.vazio) + '</td><td class="n">' + g.total[0] + '</td><td class="n"><b>' + br(g.total[1]) + '</b></td>' +

ACOES.pDia = function (d) { S.G.pAberto[d.d] = !S.G.pAberto[d.d]; desenharPainelDias(); };
ACOES.pTodos = function () { var r = S.G.pDias, todos = r.dias.every(function (d) { return S.G.pAberto[d.data]; }); r.dias.forEach(function (d) { S.G.pAberto[d.data] = !todos; }); desenharPainelDias(); };
ACOES.pDoMot = function (d) { S.G.pMot = d.id; S.G.pMotAberto = {}; render(); };
/** Lançamentos de um motorista num dia, com ajuste de qualquer campo. */
ACOES.pVerDia = function (d) {
  call('gDetalhe', { motorista_id: d.id, de: d.d, ate: d.d }).then(function (r) {
    S.G.extras = r.extras; S.G.extrasTraj = r.extrasComTrajeto;
    S.G.modalDia = { motorista_id: d.id, data: d.d };
    var dia = r.dias[0];
    if (!dia) return toast('Nenhum lançamento nesse dia.', true);
    var linhas = [], tot = 0, aberto = false;
    r.dias.forEach(function (x) { x.linhas.forEach(function (l) { regLanc(l); linhas.push(l); }); tot += x.total; if (x.aberto) aberto = true; });
    var junto = { linhas: linhas.sort(function (a, b) { return a.inicio < b.inicio ? 1 : -1; }), aberto: aberto };   // mais recente em cima
    var conf = !master() ? chipConf(dia.conferido, dia.confPor)
      : dia.conferido === 'OK' ? chipConf('OK', dia.confPor) + ' <span style="font-size:11px;color:#5B6773">' + esc(dia.confPor) + '</span> <button class="g-btn sm out" data-a="desconfDia" data-id="' + d.id + '" data-d="' + d.d + '">Desfazer</button>'
      : aberto ? '<span style="font-size:12px;color:#5B6773">Dia em aberto: confirme depois que o motorista encerrar.</span>'
      : (dia.conferido === 'ALTERADO' ? chipConf('ALTERADO', dia.confPor) + ' ' : '') + '<button class="g-btn sm lime" data-a="confDia" data-id="' + d.id + '" data-d="' + d.d + '">' + I.ok + ' Confirmar produção conferida</button>';
    if (master() && !aberto) conf = '<button class="g-btn sm out" data-a="corrigirDia" data-id="' + d.id + '" data-d="' + d.d + '">' + I.lapis + ' Corrigir</button> ' + conf;
    abrirModal('<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><b style="font-size:17px">' + esc(r.motorista.nome) + '</b><div style="font-size:12px;color:#5B6773">' + dow(dia.data) + ' ' + dBrA(dia.data) + ' · ' + esc(dia.placas) + ' · ' + linhas.length + ' lançamento(s) · <b>' + brl(tot) + '</b></div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + conf + '<button class="g-btn sm out" data-a="fecharModal">Fechar</button></div></div>' +
      '<div class="g-scroll" style="max-height:60vh">' + tabelaLancs(junto, { compacta: true }) + '</div>', 'larga');
  }).catch(falha);
};
/** Tabela de lançamentos de um dia (usada em Ajustes de valor, no painel e na janela do dia). */
function tabelaLancs(d, o) {
  o = o || {};
  return '<table class="g" style="min-width:' + (o.compacta ? '100%' : '900px') + '"><thead><tr><th>Tipo</th><th>Contêiner / descrição</th><th>Origem → destino</th><th>Tam.</th><th>Carga</th><th>Início</th><th>Fim</th><th>Pago como</th><th class="n">Lançado</th><th class="n">Valor final</th><th></th></tr></thead><tbody>' +
    d.linhas.map(function (l) {
      regLanc(l);
      return '<tr class="' + (l.ajustado ? 'aj' : '') + '"><td><span class="g-chip" style="background:' + (l.categoria === 'EXTRA' ? '#F1F4D6;color:#4A5200' : '#E8F2FA;color:#145A90') + '">' + (l.categoria === 'EXTRA' ? 'EXTRA' : 'CONTÊINER') + '</span></td><td><b>' + esc(l.conteiner || l.tipo_extra) + '</b></td><td style="white-space:normal;min-width:150px">' + esc(l.destino ? l.origem + ' → ' + l.destino : l.origem || '–') + '</td><td>' + esc(l.tamanho || '–') + '</td><td>' + esc(l.carga || '–') + '</td><td>' + hh(l.inicio) + '</td><td>' + hh(l.fim) + (l.fim.slice(0, 10) > l.data_operacional ? ' (' + dBr(l.fim) + ')' : '') + '</td><td>' + l.pagamento + '</td>' +
        '<td class="n" style="' + (l.valor_final !== l.valor_lancado ? 'text-decoration:line-through;color:#5B6773' : '') + '">' + br(l.valor_lancado) + '</td><td class="n"><b style="' + (l.ajustado ? 'color:#8A5300' : '') + '">' + br(l.valor_final) + '</b>' + (l.ajuste ? '<div style="font-size:10px;color:#8A5300">' + esc(l.ajuste.por) + ' · ' + esc(l.ajuste.em) + '</div>' : '') + '</td>' +
        '<td>' + (!master() ? '' : d.aberto ? '<span style="font-size:11px;color:#5B6773">Dia aberto</span>' : '<button class="g-btn sm out" data-a="gAjustar" data-id="' + l.id + '">' + I.lapis + ' Ajustar</button>') + '</td></tr>';
    }).join('') + '</tbody></table>';
}
/** Motorista escolhido: toda a produção dele, dia a dia, em sequência. */
function buscarPainelMotorista(mid, p) {
  document.getElementById('pBtns').innerHTML = '<button class="g-btn lime" data-a="pConferir" data-id="' + mid + '">' + I.conferir + ' Conferir</button>' + menuExportar('<button class="g-btn out" data-a="gIndiv" data-id="' + mid + '" data-f="xlsx">' + I.baixar + ' Excel</button><button class="g-btn out" data-a="gIndiv" data-id="' + mid + '" data-f="pdf">' + I.baixar + ' PDF</button>');
  callRapido('gDetalhe', { motorista_id: mid, de: p.de, ate: p.ate }, function (r) {
    S.G.extras = r.extras; S.G.extrasTraj = r.extrasComTrajeto;
    S.G.pDet = r; S.G.pMotAberto = S.G.pMotAberto || {};
    r.dias.sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : (a.aberta_em < b.aberta_em ? 1 : -1); });   // mais recente em cima
    r.dias.forEach(function (d) { d.linhas.sort(function (a, b) { return a.inicio < b.inicio ? 1 : -1; }); });
    var tot = 0, qtd = 0, aj = 0; r.dias.forEach(function (d) { tot += d.total; qtd += d.linhas.length; d.linhas.forEach(function (l) { if (l.ajustado) aj++; }); });
    var datas = {}; r.dias.forEach(function (d) { datas[d.data] = 1; });
    document.getElementById('pKpis').innerHTML = '<div class="g-kpi"><span>Dias trabalhados</span><b>' + Object.keys(datas).length + '</b></div><div class="g-kpi"><span>Lançamentos</span><b>' + qtd + '</b></div><div class="g-kpi navy"><span>Valor do período</span><b>' + brl(tot) + '</b></div><div class="g-kpi warn"><span>Ajustados pelo auditor</span><b>' + aj + '</b></div>';
    desenharPainelMotorista();
  });
}

/* ---------- Fechamento da quinzena ---------- */
function fechQuinzenaPadrao() {
  var d = new Date(), q = quinzenaAtual();

  else if (d.getDate() >= 16 && d.getDate() <= 20) q.q = 1;
  return q;
}

      document.getElementById('layer').innerHTML = '<div class="full"><div class="bar"><b>' + esc(r.nome.replace(/_/g, ' ')) + '</b><button class="g-btn sm out" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)" data-a="relImprimir">Imprimir</button><button class="g-btn sm lime" data-a="relBaixarDe" data-f="pdf">' + I.baixar + ' PDF</button><button class="g-btn sm lime" data-a="relBaixarDe" data-f="xlsx">' + I.baixar + ' Excel</button><button class="ic-btn" data-a="fecharModal" aria-label="Fechar">' + I.fechar + '</button></div><iframe id="relFrame" title="Relatório"></iframe></div>';
      document.getElementById('relFrame').srcdoc = r.html;
    } else baixarArquivo(r);
  }).catch(falha);
}

/* ---------- Excel montado no aparelho (mais rápido que converter no Google Drive) ---------- */
var URLS_EXCELJS = ['https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js'];
function carregarScript(src) {
  return new Promise(function (res, rej) {
    var s = document.createElement('script'), t = setTimeout(function () { rej(new Error('demorou')); }, 25000);
    s.src = src; s.onload = function () { clearTimeout(t); res(); }; s.onerror = function () { clearTimeout(t); s.remove(); rej(new Error('falhou')); };
    document.head.appendChild(s);
  });
}
function carregarExcelJS() {
  if (window.ExcelJS) return Promise.resolve();
  if (S._xl) return S._xl;
  S._xl = carregarScript(URLS_EXCELJS[0]).catch(function () { return carregarScript(URLS_EXCELJS[1]); })
    .then(function () { if (!window.ExcelJS) throw new Error('sem ExcelJS'); }, function (e) { S._xl = null; throw e; });
  return S._xl;
}
function baixarBlob(blob, nome) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 6000);
  toast('Arquivo baixado: ' + nome);
}
var XL = {
  cor: function (hex) { return { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + String(hex).replace('#', '').toUpperCase() } }; },
  borda: { top: { style: 'thin', color: { argb: 'FFD5DCE3' } }, left: { style: 'thin', color: { argb: 'FFD5DCE3' } }, bottom: { style: 'thin', color: { argb: 'FFD5DCE3' } }, right: { style: 'thin', color: { argb: 'FFD5DCE3' } } },
  moeda: '"R$" #,##0.00;[Red]-"R$" #,##0.00',
  salvar: function (wb, nome) { return wb.xlsx.writeBuffer().then(function (buf) { baixarBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), nome); }); }
};
/** Tabela simples (relatórios): primeira linha é o cabeçalho, a não ser que o servidor diga o contrário. */
function xlsxDeTabela(r) {
  var wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('Relatório'), larg = [];
  var inteiras = {}; (r.colInteiras || []).forEach(function (c) { inteiras[c] = 1; });
  var neg = {}; (r.negrito || []).forEach(function (n) { neg[n] = 1; });
  r.tabela.forEach(function (l, i) {
    var row = ws.addRow(l);
    l.forEach(function (v, j) {
      var c = row.getCell(j + 1), fundo = r.fundos && r.fundos[i] && r.fundos[i][j];
      larg[j] = Math.max(larg[j] || 6, Math.min(48, String(v === null || v === undefined ? '' : v).length + 2));
      if (typeof v === 'number' && !inteiras[j + 1]) c.numFmt = '#,##0.00';
      if (fundo) { c.fill = XL.cor(fundo); if (/0B3D61/i.test(fundo)) c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; }
      if (!r.semCabecalho && i === 0) { c.fill = XL.cor('#0B3D61'); c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; }
    });
    if (neg[i + 1]) row.font = Object.assign({}, row.font || {}, { bold: true });
  });
  larg.forEach(function (w, j) { ws.getColumn(j + 1).width = w; });
  ws.views = [r.semCabecalho ? { state: 'frozen', xSplit: 2, ySplit: 0 } : { state: 'frozen', ySplit: 1 }];
  return XL.salvar(wb, r.nome + '.xlsx');
}

function baixarArquivo(r) {
  try {
    var bin = atob(r.base64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
    var a = document.createElement('a'); a.href = url; a.download = r.nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('Arquivo baixado: ' + r.nome);
  } catch (e) { toast('Não consegui baixar o arquivo.', true); }
}
